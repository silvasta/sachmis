[project]
name = "sachmis"
version = "0.4.0b2"
description = "Launch LLM calls, pipelines and handle local data management"
readme = "README.md"
authors = [{ name = "silvan", email = "silvasta3@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
  "boltons>=25.0.0",
  "dotenv>=0.9.9",
  "filelock>=3.25.2",
  "google-genai>=1.59.0",
  "loguru>=0.7.3",
  "matplotlib>=3.10.9",   # TODO: check optional
  "networkx>=3.6.1",
  "protobuf>=6.33.1",
  "pydot>=4.0.1",         # TODO: check if needed
  "pyvis>=0.3.2",         # TODO: check if needed
  "rich>=14.1.0",
  "sstcore>=0.2.2",
  "tenacity>=9.1.4",
  "textual>=7.3.0",
  "tqdm>=4.67.1",         # TODO: check replace with rich
  "typer>=0.19.2",
  "xai-sdk>=1.2.0",
]

[tool.uv.sources]
sstcore = { path = "/home/silvan/Code/sstcore/latest", editable = true }
# sstcore = { git = "https://github.com/silvasta/silvasta", tag = "v0.3.0b2" }

[project.scripts]
sachmis = "sachmis.__main__:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pre-commit>=4.6.0", "pytest>=9.0.3", "ruff>=0.15.12", "ty>=0.0.46"]

[project.urls]
Repository = "https://github.com/silvasta/sachmis"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.src]
include = ["src"]
exclude = ["src/sachmis/core/retry"]

[tool.ruff]
line-length = 79
[tool.ruff.lint]
select = [
  "E",  # E: pycodestyle errors
  "F",  # F: Pyflakes
  "I",  # I: isort (import sorting)
  "UP", # UP: pyupgrade (modernize syntax)
  "B",  # B: flake8-bugbear (finds likely bugs)
  "N",  # N: pep8-naming
]
ignore = [
  "E501", # Ignore long lines: only format, not error on them
]

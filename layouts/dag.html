    <body>
        <div class="card" style="width: 100%">


            <div id="mynetwork" class="card-body"></div>
        </div>




        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };





              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');



                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#1E90FF", "font": {"color": "white"}, "id": "fff", "label": "[P] fff\ntree_zero", "shape": "ellipse"}, {"color": "#32CD32", "font": {"color": "white"}, "id": "aaa", "label": "[R] aaa\ntree_zero", "shape": "ellipse"}, {"color": "#32CD32", "font": {"color": "white"}, "id": "aab", "label": "[R] aab\ntree_zero", "shape": "ellipse"}, {"color": "#32CD32", "font": {"color": "white"}, "id": "aac", "label": "[R] aac\ntree_zero", "shape": "ellipse"}, {"color": "#1E90FF", "font": {"color": "white"}, "id": "gff", "label": "[P] gff\ntree_zero", "shape": "ellipse"}, {"color": "#32CD32", "font": {"color": "white"}, "id": "hff", "label": "[R] hff\ntree_zero", "shape": "ellipse"}, {"color": "#32CD32", "font": {"color": "white"}, "id": "iff", "label": "[R] iff\ntree_zero", "shape": "ellipse"}, {"color": "#1E90FF", "font": {"color": "white"}, "id": "new_p", "label": "[P] new_p\n", "shape": "ellipse"}, {"color": "#32CD32", "font": {"color": "white"}, "id": "new_r", "label": "[R] new_r\n", "shape": "ellipse"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#888888", "from": "fff", "to": "aac"}, {"arrows": "to", "color": "#888888", "from": "aab", "to": "new_p"}, {"arrows": "to", "color": "#888888", "from": "aaa", "to": "gff"}, {"arrows": "to", "color": "#888888", "from": "gff", "to": "hff"}, {"arrows": "to", "color": "#888888", "from": "fff", "to": "aaa"}, {"arrows": "to", "color": "#888888", "from": "fff", "to": "aab"}, {"arrows": "to", "color": "#888888", "from": "gff", "to": "iff"}, {"arrows": "to", "color": "#888888", "from": "new_p", "to": "new_r"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "barnesHut": {
            "avoidOverlap": 0,
            "centralGravity": 0.3,
            "damping": 0.09,
            "gravitationalConstant": -4000,
            "springConstant": 0.001,
            "springLength": 95
        },
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};






                  network = new vis.Network(container, data, options);










                  return network;

              }
              drawGraph();
        </script>
